<!doctype html>
<meta charset="utf-8">
<title>shot</title>
<!--
  Harness for make.sh: loads the app in demo mode (fake data, no login), puts it in a window-like
  frame, performs a few clicks so the shot shows a playing track, and sets the title to "ready".
  Usage: shot.html?theme=light|dark
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #win {
    position: absolute; inset: 24px 28px 40px; border-radius: 11px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.4), 0 22px 50px rgba(0,0,0,.32), 0 5px 14px rgba(0,0,0,.2);
  }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .dots { position: absolute; left: 8px; top: 6px; display: flex; gap: 11px; z-index: 2; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
</style>
<div id="win">
  <iframe id="f"></iframe>
  <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
</div>
<script>
  const theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light';
  localStorage.clear();
  localStorage.setItem('sl.theme', theme);
  localStorage.setItem('sl.vol', '70');

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const f = document.getElementById('f');
  f.onload = async () => {
    const d = f.contentDocument;
    const until = async (fn) => { for (let i = 0; i < 200; i++) { const v = fn(); if (v) return v; await wait(50); } throw new Error('timed out'); };
    d.documentElement.classList.add('tauri'); // room for the traffic lights, as in the desktop app
    // Rows use content-visibility:auto, which a headless capture can skip painting; force them visible.
    const css = d.createElement('style'); css.textContent = '.row{content-visibility:visible!important}'; d.head.append(css);

    (await until(() => d.querySelector('.nav[data-id="p0"]'))).click();
    await until(() => d.querySelectorAll('.row').length > 10);
    d.querySelector('.row[data-i="2"]').dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
    await wait(300);
    d.getElementById('like').click();
    d.getElementById('shuffle').click();
    const bar = d.getElementById('prog').getBoundingClientRect();
    d.getElementById('prog').dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: bar.left + bar.width * 0.38 }));
    d.querySelector('.row[data-i="6"]').click();
    await wait(400);
    document.title = 'ready';
  };
  f.src = 'app/index.html?demo';
</script>
